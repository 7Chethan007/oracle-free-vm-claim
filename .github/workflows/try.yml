name: claim-oracle-vm
on:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min (IST :37, :57, :17), off the busy :00 mark
  workflow_dispatch:
concurrency:
  group: claim # one attempt at a time, so we never double-launch or hammer the API
  cancel-in-progress: false
permissions:
  contents: read
  issues: write  # to send the "done" notification
  actions: write # to turn this workflow off when finished
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # script stops itself after ~10 min; this is only a safety net
    outputs:
      result: ${{ steps.claim.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OCI CLI
        run: for i in 1 2 3; do pip install --quiet oci-cli && break || sleep 15; done
      - name: Try to claim the VM
        id: claim
        run: bash try.sh
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          C: ${{ secrets.C }}
          AD: ${{ secrets.AD }}
          SUBNET: ${{ secrets.SUBNET }}
          IMAGE: ${{ secrets.IMAGE }}
          SSH_PUB: ${{ secrets.SSH_PUB }}
      - name: Notify and stop (VM exists)
        if: steps.claim.outputs.result == 'created' || steps.claim.outputs.result == 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.claim.outputs.result }}
          INSTANCE: ${{ steps.claim.outputs.id }}
          SHAPE: ${{ steps.claim.outputs.shape }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$OWNER" \
            --title "Oracle VM is ready ($RESULT)" \
            --body "@$OWNER your Always Free VM 'forever-free' is $RESULT in ap-hyderabad-1. Size: ${SHAPE:-see console}. Instance: ${INSTANCE:-see console}. Open Compute > Instances in the Oracle console for its public IP, then ssh -i ~/.ssh/oracle_free ubuntu@<ip>. This workflow is now disabled."
          gh workflow disable claim-oracle-vm --repo "$GITHUB_REPOSITORY"
      - name: Notify and stop (config or login is broken)
        if: steps.claim.outputs.result == 'fatal'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$OWNER" \
            --title "Oracle VM claim stopped: fix needed" \
            --body "@$OWNER Oracle rejected the request (login, ids or limits). Retrying cannot fix this, so the workflow is disabled. See the log: $RUN"
          gh workflow disable claim-oracle-vm --repo "$GITHUB_REPOSITORY"
          exit 1
      - name: Fail loudly on unknown errors
        if: steps.claim.outputs.result == 'error'
        run: echo "Every attempt hit an error we do not recognise. Read the log above." && exit 1
  next: # GitHub often skips schedule runs, so each run starts the next one ~20 min after it began
    needs: try
    if: ${{ !cancelled() && !contains(fromJSON('["created","exists","fatal","error"]'), needs.try.outputs.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
          wait=$(( $(date -d "$start" +%s) + 1200 - $(date +%s) ))
          echo "next run in ${wait}s"
          [ "$wait" -gt 0 ] && sleep "$wait"
          gh workflow run claim-oracle-vm --repo "$GITHUB_REPOSITORY" --ref main
